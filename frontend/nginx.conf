server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin for the page and the API, so the browser never needs CORS
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Unknown paths fall back to the SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }
}
